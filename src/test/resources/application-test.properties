# Test profile — uses H2 in-memory database, no Redis, no PhonePe SDK

spring.datasource.url=jdbc:h2:mem:kuberfashion_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway for tests — schema is created by Hibernate
spring.flyway.enabled=false

# Skip data initializer (it requires a Redis connection we don't have in tests)
SKIP_DATA_INITIALIZATION=true

# In-memory cache (no Redis required)
spring.cache.type=none

# No PhonePe credentials — simulation mode is explicitly enabled for tests
phonepe.client-id=
phonepe.client-secret=
phonepe.simulation-enabled=true
phonepe.redirect-url=http://localhost:5173/payment/status
phonepe.webhook-username=test_webhook_user
phonepe.webhook-password=test_webhook_password

# JWT secret for tests — 32+ bytes, clearly marked as test-only
jwt.secret=test-only-jwt-secret-used-in-unit-tests-only-do-not-use-in-prod
jwt.expiration=3600000

# Supabase — not used in tests (placeholders to satisfy @Value injection)
supabase.jwks.uri=https://example.supabase.co/auth/v1/keys
supabase.url=https://example.supabase.co
supabase.storage.bucket=kuberfashion-test
supabase.service.key=

# Cloudflare R2 — disabled in tests
cloudflare.r2.enabled=false
cloudflare.r2.access-key=
cloudflare.r2.secret-key=
cloudflare.r2.account-id=
cloudflare.r2.bucket-name=kuberfashion-test
cloudflare.r2.public-url=
