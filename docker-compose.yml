services:
  # ===============================
  # Spring Boot Backend Application
  # ===============================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kuberfashion-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Database Configuration
      DATABASE_URL: jdbc:postgresql://postgres:5432/kuberfashion
      DATABASE_USERNAME: ${DATABASE_USERNAME:-kuberfashion_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-KuberFashion@2025!}
      DATABASE_DRIVER: org.postgresql.Driver
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # PhonePe Configuration
      PHONEPE_CLIENT_ID: ${PHONEPE_CLIENT_ID}
      PHONEPE_CLIENT_SECRET: ${PHONEPE_CLIENT_SECRET}
      PHONEPE_ENVIRONMENT: ${PHONEPE_ENVIRONMENT:-SANDBOX}
      PHONEPE_REDIRECT_URL: ${PHONEPE_REDIRECT_URL}
      
      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      
      # Cloudflare R2 Configuration
      CLOUDFLARE_R2_ENABLED: ${CLOUDFLARE_R2_ENABLED:-false}
      CLOUDFLARE_R2_ACCESS_KEY: ${CLOUDFLARE_R2_ACCESS_KEY}
      CLOUDFLARE_R2_SECRET_KEY: ${CLOUDFLARE_R2_SECRET_KEY}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL}

      # AI & Vector Search Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - kuberfashion-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ===============================
  # PostgreSQL Database (with pgvector)
  # ===============================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kuberfashion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kuberfashion
      POSTGRES_USER: ${DATABASE_USERNAME:-kuberfashion_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-KuberFashion@2025!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - kuberfashion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-kuberfashion_user} -d kuberfashion"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===============================
  # Redis Cache
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: kuberfashion-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kuberfashion-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===============================
  # pgAdmin (Optional - for development)
  # ===============================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kuberfashion-pgadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kuberfashion.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - kuberfashion-network
    depends_on:
      postgres:
        condition: service_healthy

# ===============================
# Named Volumes for Persistence
# ===============================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

# ===============================
# Docker Network
# ===============================
networks:
  kuberfashion-network:
    driver: bridge
