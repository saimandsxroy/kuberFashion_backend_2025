# Development Configuration
# Use this file for local development

# Database Configuration - PostgreSQL (same as production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kuberfashion?sslmode=disable}
spring.datasource.username=${DATABASE_USERNAME:kuberfashion_user}
spring.datasource.password=${DATABASE_PASSWORD:KuberFashion@2025!}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console Disabled (using PostgreSQL)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# JWT Configuration
# Dev-only key. NEVER use this in production.
# For production, set JWT_SECRET env var to the output of: openssl rand -base64 32
jwt.secret=dev-only-jwt-secret-must-be-replaced-in-production-with-at-least-32-chars
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5177,http://127.0.0.1:5177,http://localhost:5178,http://127.0.0.1:5178

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration - More verbose for development
logging.level.com.kuberfashion.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Server Configuration
server.port=8080

# Development specific settings
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Disable Flyway for dev (using JPA create-drop instead)
spring.flyway.enabled=false

# Supabase (dev)
supabase.url=https://hanmurmflpqbfwwvqnsl.supabase.co
supabase.jwks.uri=${supabase.url}/auth/v1/keys
supabase.storage.bucket=kuberfashion-assets
# IMPORTANT: set SUPABASE_SERVICE_KEY in your shell before starting the app

# Cloudflare R2 (optional for dev; read from env)
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:kuberfashion-dev}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}

# PhonePe simulation mode (dev only)
# Enables /api/payments/confirm and /api/payments/fail endpoints.
# Set to false or remove this line before deploying to production.
phonepe.simulation-enabled=true
